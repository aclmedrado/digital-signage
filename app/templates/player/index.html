<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Signage</title>
  <link rel="stylesheet" href="/static/player.css">
  <script src="/static/player.js" defer></script>
</head>
<body data-manifest="/player/s/{{ slug }}/manifest">
  <main id="stage" aria-label="Programação da tela"></main>
  <p id="status" role="status" aria-live="polite">Carregando programação…</p>
  <p id="connection" role="status" hidden>Conexão indisponível. Tentando novamente…</p>
  <noscript>Habilite JavaScript para reproduzir a programação.</noscript>
</body>
</html>
