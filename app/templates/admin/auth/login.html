{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
  <div class="page-heading"><div><h1>Entrar</h1><p>Identifique-se para administrar telas e mídias.</p></div></div>
  <div class="form-panel">
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('admin_submit_login') }}">
      <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
      <div class="field">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
      </div>
      <button class="button" type="submit">Entrar</button>
    </form>
  </div>
{% endblock %}
