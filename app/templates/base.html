<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Telas{% endblock %} | Digital Signage</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/admin.css') }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="{{ url_for('admin_screens') if request.state.auth is defined else url_for('admin_login') }}">Digital Signage</a>
      {% if request.state.auth is defined %}
      <nav aria-label="Navegação principal">
        <a href="{{ url_for('admin_screens') }}">Telas</a>
        <a href="{{ url_for('admin_media') }}">Mídias</a>
      </nav>
      <div class="account-actions">
        <span>{{ request.state.auth.username }}</span>
        <form method="post" action="{{ url_for('admin_logout') }}">
          <input type="hidden" name="csrf_token" value="{{ request.state.auth.csrf_token }}">
          <button class="button secondary" type="submit">Sair</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main id="conteudo" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">Administração de telas e mídias</footer>
</body>
</html>
