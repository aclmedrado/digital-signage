name: digital-signage

services:
  signage-app:
    image: digital-signage:etapa006
    build: .
    container_name: digital-signage-app
    restart: unless-stopped
    ports:
      - "${SIGNAGE_BIND_IP:-127.0.0.1}:${SIGNAGE_PORT:-8080}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/signage.db}"
      MAX_VIDEO_UPLOAD_MB: "${MAX_VIDEO_UPLOAD_MB:-250}"
      MAX_IMAGE_UPLOAD_MB: "${MAX_IMAGE_UPLOAD_MB:-10}"
      MAX_IMAGE_PIXELS: "${MAX_IMAGE_PIXELS:-20000000}"
      MAX_IMAGE_FRAMES: "${MAX_IMAGE_FRAMES:-100}"
      MAX_IMAGE_TOTAL_PIXELS: "${MAX_IMAGE_TOTAL_PIXELS:-100000000}"
      FFPROBE_TIMEOUT_SECONDS: "${FFPROBE_TIMEOUT_SECONDS:-15}"
      SIGNAGE_BIND_IP: "${SIGNAGE_BIND_IP:-127.0.0.1}"
      SIGNAGE_PORT: "${SIGNAGE_PORT:-8080}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      LOCAL_AUTH_TEST_MODE: "${LOCAL_AUTH_TEST_MODE:-false}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-}"
      SESSION_ABSOLUTE_SECONDS: "${SESSION_ABSOLUTE_SECONDS:-28800}"
      SESSION_IDLE_SECONDS: "${SESSION_IDLE_SECONDS:-1800}"
      SESSION_TOUCH_SECONDS: "${SESSION_TOUCH_SECONDS:-300}"
      LOGIN_CHALLENGE_SECONDS: "${LOGIN_CHALLENGE_SECONDS:-600}"
      LOGIN_ATTEMPT_WINDOW_SECONDS: "${LOGIN_ATTEMPT_WINDOW_SECONDS:-900}"
      LOGIN_ACCOUNT_ATTEMPTS: "${LOGIN_ACCOUNT_ATTEMPTS:-5}"
      LOGIN_ORIGIN_ATTEMPTS: "${LOGIN_ORIGIN_ATTEMPTS:-20}"
    volumes:
      - signage-data:/app/data
      - signage-media:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); assert r.status == 200 and json.load(r) == {'status': 'ok'}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  signage-data:
  signage-media:
